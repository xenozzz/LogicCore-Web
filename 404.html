<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Page not found on LogicCore.">
    <title>404 | Page Not Found | LogicCore</title>
    <link rel="icon" type="image/x-icon" href="Assets/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="global.css">

    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://cdn.tailwindcss.com https://fonts.googleapis.com https://fonts.gstatic.com; img-src 'self' data: https://logiccore.cloud; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta name="referrer" content="strict-origin-when-cross-origin">
</head>
<body class="min-h-screen flex items-center justify-center px-4">
    <main class="section-card max-w-2xl w-full p-8 sm:p-12 text-center">
        <p class="badge">404 Error</p>
        <h1 class="mt-4 text-4xl font-extrabold">This page isn't here.</h1>
        <p class="mt-4 text-lg text-slate-600">The link may be outdated or the page may have moved. Head back to the homepage to continue.</p>
        <a href="index.html" class="mt-8 inline-block cta-primary px-6 py-3 rounded-xl text-sm font-bold">Back to Homepage</a>
    </main>
</body>
</html>
