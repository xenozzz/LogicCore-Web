<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | Page Not Found | LogicCore</title>
    <link rel="apple-touch-icon" sizes="180x180" href="Assets/favicons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="Assets/favicons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="Assets/favicons/favicon-16x16.png">
    <link rel="shortcut icon" href="Assets/favicons/favicon-32x32.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="global.css">
    <script src="site.js" defer></script>

    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://cdn.tailwindcss.com https://fonts.googleapis.com https://fonts.gstatic.com; img-src 'self' data: https://logiccore.cloud; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta name="referrer" content="strict-origin-when-cross-origin">
</head>
<body class="text-slate-900 antialiased flex flex-col min-h-screen">
    <main class="flex-grow flex items-center justify-center px-4">
        <section class="section-card p-10 max-w-xl text-center" data-reveal>
            <p class="badge">Error 404</p>
            <h1 class="mt-4 font-display text-4xl font-extrabold">We couldn’t find that page.</h1>
            <p class="mt-4 text-slate-600">It may have moved, been removed, or the URL might be incorrect.</p>
            <div class="mt-8 flex items-center justify-center gap-3">
                <a href="index.html" class="cta-primary px-6 py-3 rounded-lg font-semibold">Back to Home</a>
                <a href="contact.html" class="cta-secondary px-6 py-3 rounded-lg font-semibold">Contact Us</a>
            </div>
            <p class="mt-5 text-sm text-slate-500">
                Read our <a href="privacy.html" class="footer-link">Privacy Policy</a>.
            </p>
        </section>
    </main>
</body>
</html>
